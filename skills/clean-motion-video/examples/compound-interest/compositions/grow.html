<template>
  <style>
    #root { position: absolute; inset: 0; overflow: hidden; }
    #grow-wrap { position: absolute; inset: 0; }
    #grow-card { position: absolute; left: 120px; width: 760px; top: 470px; padding: 48px 56px 40px; }
    #grow-card .row { display: flex; justify-content: space-between; align-items: baseline; }
    #grow-card .lbl { font-size: 32px; color: #86868B; font-weight: 500; }
    #grow-year { font-size: 32px; color: #111113; font-weight: 600; font-variant-numeric: tabular-nums; }
    #grow-amt { font-size: 128px; font-weight: 700; letter-spacing: -0.04em; margin-top: 10px; font-variant-numeric: tabular-nums; color: #111113; }
    #grow-bars { display: flex; align-items: flex-end; gap: 10px; height: 300px; margin-top: 36px; }
    #grow-bars i { flex: 1; background: #E3E3E8; border-radius: 8px 8px 3px 3px; transform-origin: 50% 100%; display: block; }
    #grow-bars i.on { background: #0A84FF; }
    #grow-rate { position: absolute; left: 580px; top: 410px; font-size: 38px; font-weight: 700; color: #0A84FF; }
    #grow-cap { position: absolute; left: 120px; right: 300px; top: 1150px; font-size: 48px; }
  </style>
  <div id="root" data-composition-id="grow" data-width="1080" data-height="1920">
    <div class="cm-ground"></div>
    <div id="grow-wrap">
      <div id="grow-card" class="cm-card">
        <div class="row"><span class="lbl">Balance</span><span id="grow-year">Year 0</span></div>
        <div id="grow-amt">$10,000</div>
        <div id="grow-bars"></div>
      </div>
      <div id="grow-rate" class="cm-chip">8% / year</div>
      <p id="grow-cap" class="cm-line">becomes <b>$46,610</b> in 20 years</p>
    </div>
  </div>
  <script>
    (function () {
      const root = document.querySelector('[data-composition-id="grow"]');
      const $ = (s) => root.querySelector(s);
      const tl = gsap.timeline({ paused: true });

      // 21 bars (year 0..20), heights proportional to 1.08^n. Built once, before tweens.
      const bars = $("#grow-bars");
      for (let n = 0; n <= 20; n++) { const b = document.createElement("i"); b.style.height = (Math.pow(1.08, n) / Math.pow(1.08, 20)) * 100 + "%"; bars.appendChild(b); }
      const els = Array.from(bars.children);

      CM.pop(tl, $("#grow-card"), 0.2, { from: 0.85, ease: "expo.out", dur: 0.5 });
      CM.pop(tl, $("#grow-rate"), 1.72);

      // "becomes ... forty six thousand ... in twenty years": count + bars grow together
      const t0 = 2.6, d = 2.2;
      CM.count(tl, $("#grow-amt"), t0, 10000, 46610, { dur: d, ease: "power2.in", fmt: (n) => "$" + Math.round(n).toLocaleString("en-US") });
      CM.count(tl, $("#grow-year"), t0, 0, 20, { dur: d, ease: "none", fmt: (n) => "Year " + Math.round(n) });
      els.forEach((b, i) => {
        const at = t0 + (i / 20) * d;
        tl.fromTo(b, { scaleY: 0.04 }, { scaleY: 1, duration: 0.25, ease: "back.out(1.4)" }, at);
        tl.fromTo(b, { backgroundColor: "#E3E3E8" }, { backgroundColor: "#0A84FF", duration: 0.12 }, at);
      });
      tl.fromTo($("#grow-amt"), { color: "#111113" }, { color: "#1F9D4C", duration: 0.25, ease: "power2.out" }, t0 + d);
      CM.speak(tl, $("#grow-cap"), [2.63, 3.11, 4.23, 4.39, 4.71]);

      CM.whip(tl, $("#grow-wrap"), null, 5.2, { dir: "left", dur: 0.25 });
      window.__timelines["grow"] = tl;
    })();
  </script>
</template>
