<template>

      <div id="__ID__-line">__LINE__</div>
      <div id="__ID__-card">

        <div><div id="__ID__-nm">__CHANNEL__</div><div id="__ID__-sb">__SUB__</div></div>

    (function () {
      const root = document.querySelector('[data-composition-id="__ID__"]');
      const $ = (s) => root.querySelector(s);
      const tl = gsap.timeline({ paused: true });
      tl.fromTo($("#__ID__-wrap"), { opacity: 0, y: 70, filter: "blur(10px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.5, ease: "expo.out" }, 0.0);

      [[0, -18], [-18, 16], [16, -12], [-12, 8], [8, 0]].forEach(([a, b], i) =>

      tl.fromTo($("#__ID__-line"), { opacity: 1 }, { opacity: 0, duration: 0.15, immediateRender: false }, p2 + 0.02);
      CM.pop(tl, $("#__ID__-on"), p2 + 0.1);
      tl.fromTo($("#__ID__-wrap"), { opacity: 1, y: 0, filter: "blur(0px)" }, { opacity: 0, y: 50, filter: "blur(10px)", duration: 0.35, ease: "power3.in", immediateRender: false }, __OUT__);
